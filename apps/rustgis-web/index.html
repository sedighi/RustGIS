<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>RustGIS</title>
  <link rel="icon" href="https://assets.rustgis.app/images/favicon.png">
  <link data-trunk rel="rust" data-bin="rustgis-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="copy-dir" href="fonts" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e4e8ee; }
    #rustgis_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #rustgis_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: #4a5563; font: 14px system-ui, sans-serif; pointer-events: none; }
    #rustgis_loading img { width: 96px; height: 96px; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="rustgis_canvas"></canvas>
  <div id="rustgis_loading"><img src="https://assets.rustgis.app/images/logo.svg" alt=""><div>Loading RustGIS&hellip;</div></div>
</body>
</html>
