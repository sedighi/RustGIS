# Publishes the latest release's files to the opengeos/rustgis-downloads GitHub Pages repository
# (https://downloads.rustgis.app) after every release build. The hosting repository holds only
# the generated site; the page templates and the builder live in packaging/downloads.
#
# Required repository secret:
#   DOWNLOADS_DEPLOY_KEY - private half of an SSH deploy key with write access to
#                          opengeos/rustgis-downloads
name: Sync downloads.rustgis.app

on:
  # The app's packages (Release) and the Python wheels (Python package) are attached by separate
  # workflows; whichever finishes last brings the mirror up to date.
  workflow_run:
    workflows: [Release, Python package]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (defaults to the latest release)
        required: false
        type: string
  schedule:
    # Safety net for release assets added or replaced outside the release workflow.
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: downloads-mirror
  cancel-in-progress: true

jobs:
  sync:
    name: Publish the latest release
    # A workflow_run fires for trial runs too; only a published release's build counts.
    if: >-
      github.repository == 'opengeos/RustGIS' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'release' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DESTINATION_REPOSITORY: opengeos/rustgis-downloads
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          WORKFLOW_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${REQUESTED_TAG:-${WORKFLOW_TAG:-}}"
          if [ -z "$tag" ]; then
            if ! tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
              echo "::notice::No release yet: nothing to mirror."
              exit 0
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Configure the hosting repository deploy key
        if: steps.release.outputs.tag != ''
        env:
          DOWNLOADS_DEPLOY_KEY: ${{ secrets.DOWNLOADS_DEPLOY_KEY }}
        run: |
          if [ -z "${DOWNLOADS_DEPLOY_KEY:-}" ]; then
            echo "::error::DOWNLOADS_DEPLOY_KEY is not configured."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DOWNLOADS_DEPLOY_KEY" > "$HOME/.ssh/rustgis-downloads"
          chmod 600 "$HOME/.ssh/rustgis-downloads"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          printf 'Host github.com\n  IdentityFile ~/.ssh/rustgis-downloads\n  IdentitiesOnly yes\n' > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Build the candidate manifest
        if: steps.release.outputs.tag != ''
        env:
          DOWNLOAD_MIRROR_METADATA_ONLY: "true"
          TAG: ${{ steps.release.outputs.tag }}
        run: packaging/downloads/build.sh "$RUNNER_TEMP/candidate" "$TAG"

      - name: Skip an unchanged mirror
        id: changes
        if: steps.release.outputs.tag != ''
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            "git@github.com:$DESTINATION_REPOSITORY.git" current
          # The page templates count too: a change to them republishes the same release.
          if git -C current show HEAD:manifest.json > current-manifest.json 2>/dev/null &&
            git -C current show HEAD:app.js > current-app.js 2>/dev/null &&
            git -C current show HEAD:styles.css > current-styles.css 2>/dev/null &&
            git -C current show HEAD:index.html > current-index.html 2>/dev/null &&
            cmp -s <(jq 'del(.generated_at)' current-manifest.json) <(jq 'del(.generated_at)' candidate/manifest.json) &&
            cmp -s current-app.js "$GITHUB_WORKSPACE/packaging/downloads/app.js" &&
            cmp -s current-styles.css "$GITHUB_WORKSPACE/packaging/downloads/styles.css" &&
            cmp -s current-index.html "$GITHUB_WORKSPACE/packaging/downloads/index.html"; then
            echo "The mirror already has this release and page."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the mirror
        if: steps.changes.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: packaging/downloads/build.sh "$RUNNER_TEMP/site" "$TAG"

      - name: Publish an orphan snapshot
        if: steps.changes.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/site
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git init --initial-branch=main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "git@github.com:$DESTINATION_REPOSITORY.git"
          git add --all
          git commit -m "Mirror RustGIS ${TAG}"
          # Parentless snapshots keep old release files out of the hosting repository's history.
          git push --force origin HEAD:main
          echo "Published ${TAG} to https://downloads.rustgis.app"
